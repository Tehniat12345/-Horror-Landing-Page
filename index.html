<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ruins | Forgotten Shadows</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100vh; overflow: hidden; font-family: 'Special Elite', cursive; background: #050505; }

        .ruins-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Foggy Dark Forest/Ruins Background */
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%), 
                        url('https://images.unsplash.com/photo-1505832018823-50331d70d237?q=80&w=2008') no-repeat center center/cover;
            padding: 20px;
        }

        .main-card {
            width: 95%;
            max-width: 1100px;
            height: 80vh;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid #333;
            display: flex;
            box-shadow: 0 0 100px rgba(0,0,0,1), inset 0 0 50px rgba(255,0,0,0.05);
            overflow: hidden;
            position: relative;
        }

        /* Dust/Ash Particles Effect */
        .main-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3;
            pointer-events: none;
        }

        /* Left Side: Story */
        .info-panel {
            flex: 1.2;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 5;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .warning-tag {
            color: #ff0000;
            font-size: 0.8rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-family: 'Nosifer', cursive;
            font-size: 4rem;
            line-height: 1;
            color: #666;
            margin-bottom: 25px;
            text-shadow: 5px 5px 15px #000;
        }

        h1 span {
            color: #8b0000;
            display: block;
            font-family: 'Creepster', cursive;
            font-size: 5.5rem;
        }

        p {
            color: #888;
            line-height: 1.8;
            margin-bottom: 40px;
            font-size: 1.1rem;
            max-width: 450px;
        }

        .explore-btn {
            padding: 15px 40px;
            background: transparent;
            color: #8b0000;
            text-decoration: none;
            border: 1px solid #8b0000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.5s;
            width: fit-content;
        }

        .explore-btn:hover {
            background: #8b0000;
            color: #000;
            box-shadow: 0 0 30px #8b0000;
            transform: scale(1.05);
        }

        /* Right Side: Khander Image */
        .visual-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .ruin-pic {
            width: 100%;
            height: 100%;
            /* Abandoned Castle/Ruins Image */
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1968') no-repeat center center/cover;
            transition: 3s ease-in-out;
            filter: grayscale(100%) contrast(1.2) brightness(0.7);
        }

        .main-card:hover .ruin-pic {
            filter: grayscale(50%) contrast(1.5) brightness(0.5);
            transform: scale(1.1);
        }

        .status-badge {
            position: absolute;
            bottom: 40px;
            right: 40px;
            color: rgba(255,255,255,0.2);
            font-size: 0.7rem;
            text-align: right;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="ruins-wrapper">
        <div class="main-card">
            <div class="info-panel">
                <div class="warning-tag">DO NOT ENTER AFTER DARK</div>
                <h1>The Silent<span>Khander.</span></h1>
                <p>Sadiyon purani deewarein aur un mein dabe huye raaz. Har pathar ek kahani sunata hai, par kya aap mein sunne ki himmat hai?</p>
                <a href="#" class="explore-btn">Enter If You Dare</a>
            </div>

            <div class="visual-panel">
                <div class="ruin-pic"></div>
                <div class="status-badge">
                    COORDINATES<br>
                    <b>[42.36° N, 71.05° W]</b>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
